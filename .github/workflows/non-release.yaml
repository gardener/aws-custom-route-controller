name: Build
on:
  # Only pushes to the default branch publish credentialed snapshot artifacts; other
  # branches are validated through pull_request without publish credentials.
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@v1
    needs:
      - build
    permissions:
      id-token: write
      # contents: write is required by the upstream draft-release job (only runs on
      # push to the default branch). The branch restriction above is what prevents
      # arbitrary-branch pushes from reaching the credentialed publish path.
      contents: write
